# Full stack: API, worker, PostgreSQL, Redis, RabbitMQ, Prometheus, Grafana.
# Run:  docker compose up --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: simulator_dev_pw
      POSTGRES_DB: simulator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: simulator
      RABBITMQ_DEFAULT_PASS: simulator_dev_pw
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args: { APP: api }
    environment:
      DATABASE_URL: postgres://simulator:simulator_dev_pw@postgres:5432/simulator?sslmode=disable
      REDIS_ADDR: redis:6379
      AMQP_URL: amqp://simulator:simulator_dev_pw@rabbitmq:5672/
      HTTP_ADDR: ":8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8080:8080"

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args: { APP: worker }
    environment:
      BROKER: rabbitmq
      AMQP_URL: amqp://simulator:simulator_dev_pw@rabbitmq:5672/
      REDIS_ADDR: redis:6379
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/simulator.json:/var/lib/grafana/dashboards/simulator.json:ro

volumes:
  pgdata:
